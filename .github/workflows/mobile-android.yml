name: Mobile Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS API base URL for this build (for example, https://api.example.com)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobile/pubspec.yaml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate Android platform scaffold
        working-directory: mobile
        run: |
          flutter create --platforms=android --project-name matka_platform_mobile --org com.matkaplatform /tmp/matka-platform-android
          cp -a /tmp/matka-platform-android/android ./android

      - name: Ensure Android internet permission
        working-directory: mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          contents = manifest.read_text()
          permission = re.compile(
              r'<uses-permission\b(?=[^>]*\bandroid:name=["\']android\.permission\.INTERNET["\'])[^>]*/?>'
          )
          if not permission.search(contents):
              root = re.search(r'<manifest\b[^>]*>', contents)
              if root is None:
                  raise SystemExit("Could not find the Android manifest root element.")
              contents = (
                  contents[:root.end()]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + contents[root.end():]
              )
              manifest.write_text(contents)
          if not permission.search(manifest.read_text()):
              raise SystemExit("Android internet permission was not added.")
          print("Android INTERNET permission is present in the release manifest.")
          PY

      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze

      - name: Run widget tests
        working-directory: mobile
        run: flutter test

      - name: Validate release API URL
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["API_BASE_URL"].strip()
          parsed = urlsplit(value)
          try:
              valid_port = parsed.port is None or 1 <= parsed.port <= 65535
          except ValueError:
              valid_port = False
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
              or not valid_port
          ):
              raise SystemExit(
                  "Release APK builds require an HTTPS origin without credentials, paths, query, or fragment."
              )
          print(f"Validated HTTPS API origin: {parsed.scheme}://{parsed.netloc}")
          PY

      - name: Build release APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matka-platform-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7